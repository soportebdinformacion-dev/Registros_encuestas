<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrícola Huarmey - Encuestas</title>
    <style>
        :root { 
            --rojo: #D32F2F; 
            --verde: #2E7D32; 
            --gris: #f4f4f4; 
            --naranja: #EF6C00; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--gris); 
            margin: 0; 
            padding: 10px; 
        }

        .container { 
            background: white; 
            width: 95%;           
            max-width: 850px;     
            margin: 10px auto; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            border-top: 6px solid var(--rojo); 
            box-sizing: border-box; 
        }

        .logo { 
            display: block; 
            margin: 0 auto 15px; 
            width: 100%;
            max-width: 100%;   
            height: auto;      
            border-radius: 8px; 
        }

        h2 { color: var(--verde); text-align: center; font-size: 1.2rem; margin-bottom: 15px; }
        
        fieldset { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; padding: 15px; }
        legend { font-weight: bold; color: var(--rojo); padding: 0 8px; font-size: 13px; }
        label { display: block; margin-top: 10px; font-weight: 600; font-size: 13px; }
        
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            margin-top: 4px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        
        input[readonly] { background: #f0f0f0; }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr; 
            gap: 10px 20px;
        }

        .full-width { grid-column: 1 / -1; } 

        .btn-search { background: var(--verde); color: white; border: none; padding: 12px; margin-top: 8px; border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; }
        .btn-submit { background: var(--rojo); color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-download { background: var(--naranja); color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 20px; cursor: pointer; }

        .status-bar { text-align: center; padding: 10px; margin-top: 15px; border-radius: 6px; font-weight: bold; font-size: 13px; transition: 0.3s; }
        .online { background: #C8E6C9; color: #2E7D32; border: 1px solid #2E7D32; }
        .offline { background: #FFCDD2; color: #C62828; border: 1px solid #C62828; }

        #listaPendientes { margin-top: 15px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; padding: 10px; background: #fffde7; display: none; }
        .pendientes-titulo { font-weight: bold; color: #856404; margin-bottom: 5px; display: block; }

        @media (min-width: 768px) {
            body { padding: 30px; }
            .container { padding: 40px; }
            .grid-container { grid-template-columns: 1fr 1fr; } 
        }
    </style>
</head>
<body>

<div class="container">
    <img src="FLYER BIENVENIDA FRUSAN.png" class="logo" alt="Logo">
    <h2>Registro de Encuestas - Campaña 2026</h2>

    <div id="connectionStatus" class="status-bar online">Detectando conexión...</div>

    <div id="listaPendientes">
        <span class="pendientes-titulo">📂 Registros pendientes de sincronizar:</span>
        <div id="itemsPendientes"></div>
    </div>

    <form id="formEncuesta">
        <fieldset>
            <legend>1. INFORMACIÓN PERSONAL</legend>
            <div class="grid-container">
                <div class="full-width">
                    <label>Tipo de registro:</label>
                    <select id="tipoRegistro" required>
                        <option value="">Seleccione usuario...</option>
                        <option value="JOSE CHAVEZ">JOSE CHAVEZ</option>
                        <option value="RIVALDO VALLES">RIVALDO VALLES</option>
                        <option value="ALEX RUFASTO">ALEX RUFASTO</option>
                        <option value="OSCAR BARREDA">OSCAR BARREDA</option>
                        <option value="PILAR MONJA">PILAR MONJA</option>
                    </select>
                </div>

                <div class="full-width">
                    <label>DNI:</label>
                    <input type="text" id="dni" placeholder="Ingrese 8 dígitos (ej. 00456235)" maxlength="8" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
                    <button type="button" class="btn-search" onclick="buscarDNI()">🔍 BUSCAR TRABAJADOR</button>
                </div>

                <div><label>Apellidos y nombres:</label><input type="text" id="nombres" readonly></div>

                <div style="display:flex; gap:10px">
                    <div style="flex:1"><label>Sexo:</label><input type="text" id="sexo" readonly></div>
                    <div style="flex:1"><label>Modalidad:</label><input type="text" id="modalidad" readonly></div>
                </div>

                <div><label>Celular:</label><input type="text" id="celular" readonly></div>
                <div><label>Placa:</label><input type="text" id="placa" readonly></div>
                <div><label>Origen:</label><input type="text" id="origen" readonly></div>
                <div><label>Cargo:</label><input type="text" id="cargo" readonly></div>
                <div><label>Histórico:</label><input type="text" id="historico" readonly></div>
            </div>
        </fieldset>

        <fieldset>
            <legend>2. SUPERVISIÓN Y UBICACIÓN</legend>
            <div class="grid-container">
                <div>
                    <label>Supervisor a cargo:</label>
                    <select id="supervisor" required>
                        <option value="">Seleccione...</option>
                        <option value="Frank Farroñan">Frank Farroñan</option>
                        <option value="Rony Cubas">Rony Cubas</option>
                    </select>
                </div>
                <div>
                    <label>¿Qué Módulo labora?:</label>
                    <select id="modulo_lab" required>
                        <option value="">Seleccione...</option>
                        <option value="Módulo 1-Turno 1">Módulo 1-Turno 1</option>
                        <option value="Módulo 1-Turno 2">Módulo 1-Turno 2</option>
                        <option value="Módulo 1-Turno 3">Módulo 1-Turno 3</option>
                        <option value="Módulo 1-Turno 4">Módulo 1-Turno 4</option>
                        <option value="Módulo 1-Turno 5">Módulo 1-Turno 5</option>
                        <option value="Módulo 2-Turno 1">Módulo 2-Turno 1</option>
                        <option value="Módulo 2-Turno 2">Módulo 2-Turno 2</option>
                        <option value="Módulo 2-Turno 3">Módulo 2-Turno 3</option>
                        <option value="Módulo 2-Turno 4">Módulo 2-Turno 4</option>
                        <option value="Módulo 2-Turno 5">Módulo 2-Turno 5</option>
                        <option value="Módulo 3-Turno 1">Módulo 3-Turno 1</option>
                        <option value="Módulo 3-Turno 2">Módulo 3-Turno 2</option>
                        <option value="Módulo 3-Turno 3">Módulo 3-Turno 3</option>
                        <option value="Módulo 3-Turno 4">Módulo 3-Turno 4</option>
                        <option value="Módulo 3-Turno 5">Módulo 3-Turno 5</option>
                        <option value="Módulo 4-Turno 1">Módulo 4-Turno 1</option>
                        <option value="Módulo 4-Turno 2">Módulo 4-Turno 2</option>
                        <option value="Módulo 4-Turno 3">Módulo 4-Turno 3</option>
                        <option value="Módulo 4-Turno 4">Módulo 4-Turno 4</option>
                        <option value="Módulo 4-Turno 5">Módulo 4-Turno 5</option>
                        <option value="Módulo 5-Turno 1">Módulo 5-Turno 1</option>
                        <option value="Módulo 5-Turno 2">Módulo 5-Turno 2</option>
                        <option value="Módulo 5-Turno 3">Módulo 5-Turno 3</option>
                        <option value="Módulo 5-Turno 4">Módulo 5-Turno 4</option>
                        <option value="Módulo 5-Turno 5">Módulo 5-Turno 5</option>
                        <option value="Módulo 6-Turno 1">Módulo 6-Turno 1</option>
                        <option value="Módulo 6-Turno 2">Módulo 6-Turno 2</option>
                        <option value="Módulo 6-Turno 3">Módulo 6-Turno 3</option>
                        <option value="Módulo 6-Turno 4">Módulo 6-Turno 4</option>
                        <option value="Módulo 6-Turno 5">Módulo 6-Turno 5</option>
                        <option value="Módulo 7-Turno 1">Módulo 7-Turno 1</option>
                        <option value="Módulo 7-Turno 2">Módulo 7-Turno 2</option>
                        <option value="Módulo 7-Turno 3">Módulo 7-Turno 3</option>
                        <option value="Módulo 7-Turno 4">Módulo 7-Turno 4</option>
                        <option value="Módulo 7-Turno 5">Módulo 7-Turno 5</option>
                        <option value="Módulo 8-Turno 1">Módulo 8-Turno 1</option>
                        <option value="Módulo 8-Turno 2">Módulo 8-Turno 2</option>
                        <option value="Módulo 8-Turno 3">Módulo 8-Turno 3</option>
                        <option value="Módulo 8-Turno 4">Módulo 8-Turno 4</option>
                        <option value="Módulo 8-Turno 5">Módulo 8-Turno 5</option>
                        <option value="Módulo 9-Turno 1">Módulo 9-Turno 1</option>
                        <option value="Módulo 9-Turno 2">Módulo 9-Turno 2</option>
                        <option value="Módulo 9-Turno 3">Módulo 9-Turno 3</option>
                        <option value="Módulo 9-Turno 4">Módulo 9-Turno 4</option>
                        <option value="Módulo 9-Turno 5">Módulo 9-Turno 5</option>
                    </select>
                </div>
                <div>
                    <label>¿Variedad donde se encuentra?:</label>
                    <select id="variedad" required>
                        <option value="">Seleccione...</option>
                        <option value="MAGICA 2024">MAGICA 2024</option>
                        <option value="MAGICA 2025">MAGICA 2025</option>
                        <option value="MEGAEARLY 2026">MEGAEARLY 2026</option>
                    </select>
                </div>
                <div>
                    <label>Fecha de Cosecha:</label>
                    <input type="date" id="fechaCosecha" required>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>3. CONDICIONES Y BIENESTAR</legend>
            <div class="grid-container">
                <div>
                    <label>¿Herramientas necesarias?:</label>
                    <select id="herramientas" required>
                        <option value="">Seleccione...</option>
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                        <option value="Parcialmente">Parcialmente</option>
                    </select>
                </div>
                <div>
                    <label>¿Recibes agua necesaria?:</label>
                    <select id="agua" required>
                        <option value="">Seleccione...</option>
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Insuficiente">Insuficiente</option>
                    </select>
                </div>
                <div>
                    <label>¿Fruta disponible?:</label>
                    <select id="fruta" required>
                        <option value="">Seleccione...</option>
                        <option value="Buena cantidad">Buena cantidad</option>
                        <option value="Poca fruta">Poca fruta</option>
                        <option value="Muy poca fruta">Muy poca fruta</option>
                        <option value="Fruta mala">Fruta mala</option>
                    </select>
                </div>
                <div>
                    <label>¿Faltas de respeto?:</label>
                    <select id="faltas_resp" required>
                        <option value="">Seleccione...</option>
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                    </select>
                </div>
                <div>
                    <label>¿Regresarias mañana?:</label>
                    <select id="regreso_trab" required>
                        <option value="">Seleccione...</option>
                        <option value="SI">SI</option>
                        <option value="NO">NO</option>
                    </select>
                </div>
                <div>
                    <label>¿Cómo se siente hoy?:</label>
                    <select id="siente_hoy" required>
                        <option value="">Seleccione...</option>
                        <option value="Muy motivado">Muy motivado</option>
                        <option value="Cansado">Cansado</option>
                        <option value="Molesto">Molesto</option>
                        <option value="Desmotivado">Desmotivado</option>
                    </select>
                </div>
                <div class="full-width">
                    <label>Problema más urgente:</label>
                    <select id="problemas" required>
                        <option value="">Seleccione...</option>
                        <option value="Ninguno">Ninguno</option>
                        <option value="Agua">Agua</option>
                        <option value="Baños campo">Baños campo</option>
                        <option value="Comedores campamento">Comedores campamento</option>
                        <option value="Comedores campo">Comedores campo</option>
                        <option value="Herramientas">Herramientas</option>
                        <option value="Mal trato">Mal trato</option>
                        <option value="Pagos">Pagos</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Fruta mala">Fruta mala</option>
                        <option value="Otros (Detalle en OBSERVACIONES)">Otros (Detalle en OBSERVACIONES)</option>
                    </select>
                </div>
                <div class="full-width">
                    <label>OBSERVACIONES:</label>
                    <textarea id="observaciones" rows="2"></textarea>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-submit">GUARDAR Y ENVIAR</button>
        <button type="button" class="btn-download" onclick="descargarApp()">📥 DESCARGAR APLICACIÓN (encuesta.html)</button>
    </form>
</div>

<script src="https://unpkg.com/dexie@3.2.0/dist/dexie.min.js"></script>
<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyyxPq8nACOdYfrJ5asckIbUSY6G41elpT9uZY2r6YkEDZWZ03Sitl3_VeKv-zijLH98w/exec';

    const db = new Dexie('BD_HUARMEY_ENCUESTA');
    db.version(2).stores({
        personal: 'DNI',
        registros: '++id, synchronized'
    });

    // Cargar la fecha de hoy por defecto en "Fecha de Cosecha"
    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fechaCosecha').value = today;
    });

    async function actualizarIndicadorConexion() {
        const statusDiv = document.getElementById('connectionStatus');
        if (navigator.onLine) {
            statusDiv.innerText = "🟢 CONECTADO (En línea)";
            statusDiv.className = "status-bar online";
            await enviarASheets();
        } else {
            statusDiv.innerText = "🔴 SIN CONEXIÓN (Modo Local)";
            statusDiv.className = "status-bar offline";
        }
        actualizarVisorPendientes();
    }

    async function actualizarVisorPendientes() {
        const pendientes = await db.registros.where('synchronized').equals(0).toArray();
        const contenedor = document.getElementById('listaPendientes');
        const listaItems = document.getElementById('itemsPendientes');
        
        if (pendientes.length > 0) {
            contenedor.style.display = 'block';
            listaItems.innerHTML = pendientes.map(r => `• DNI: ${r.dni} - ${r.nom || 'Sin Nombre'}`).join('<br>');
        } else {
            contenedor.style.display = 'none';
        }
    }

    function descargarApp() {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'encuesta.html';
        a.click();
    }

    window.addEventListener('online', actualizarIndicadorConexion);
    window.addEventListener('offline', actualizarIndicadorConexion);

    async function buscarDNI() {
        const dniInput = document.getElementById('dni');
        let dniVal = dniInput.value.trim();

        if (!dniVal) {
            alert("⚠️ Por favor, ingrese un número de DNI.");
            dniInput.focus();
            return;
        }

        if (!/^\d+$/.test(dniVal)) {
            alert("⚠️ Error: Solo se permiten caracteres numéricos.");
            return;
        }

        let dniLimpio = dniVal.replace(/^0+/, '');
        let dni8Digitos = dniLimpio.padStart(8, '0');
        
        dniInput.value = dni8Digitos;

        let persona = await db.personal.get(dni8Digitos);
        if (!persona && dniLimpio !== dni8Digitos) {
            persona = await db.personal.get(dniLimpio);
        }

        if (persona) {
            document.getElementById('nombres').value = persona["APELLIDOS Y NOMBRES"] || persona["Nombres"] || '';
            document.getElementById('sexo').value = persona["SEXO"] || persona["Sexo"] || '';
            document.getElementById('modalidad').value = persona["MODALIDAD"] || persona["Modalidad"] || '';
            document.getElementById('celular').value = persona["CELULAR"] || persona["Celular"] || '';
            document.getElementById('placa').value = persona["PLACA"] || persona["Placa"] || '';
            document.getElementById('origen').value = persona["ORIGEN"] || persona["Origen"] || '';
            document.getElementById('cargo').value = persona["CARGO"] || persona["Cargo"] || '';
            document.getElementById('historico').value = persona["HISTORICO"] || persona["Historico"] || '';
            alert("✅ Trabajador encontrado.");
        } else {
            alert("❌ DNI " + dni8Digitos + " no encontrado localmente.");
        }
    }

    async function actualizarPadron() {
        if (!navigator.onLine) return;
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data && data.length > 0) {
                await db.personal.clear();
                const dataClean = data.map(p => {
                    let raw = String(p.DNI || '').trim();
                    let limpio = raw.replace(/^0+/, '');
                    let dniFinal = (limpio.length > 0 && limpio.length <= 8 && !isNaN(limpio)) 
                        ? limpio.padStart(8, '0') 
                        : raw;
                    return { ...p, DNI: dniFinal };
                });
                await db.personal.bulkPut(dataClean);
            }
        } catch (e) { console.log("Error al actualizar padrón:", e); }
    }

    document.getElementById('formEncuesta').onsubmit = async (e) => {
        e.preventDefault();
        try {
            let rawInput = document.getElementById('dni').value.trim();
            let dniLimpio = rawInput.replace(/^0+/, '');
            const dniFormateado = (dniLimpio.length > 0 && dniLimpio.length <= 8 && !isNaN(dniLimpio)) 
                ? dniLimpio.padStart(8, '0') 
                : rawInput;

            const registro = {
                tipoReg: document.getElementById('tipoRegistro').value,
                dni: dniFormateado,
                nom: document.getElementById('nombres').value,
                sex: document.getElementById('sexo').value,
                eda: document.getElementById('modalidad').value,
                cel: document.getElementById('celular').value,
                fun: document.getElementById('placa').value,
                are: document.getElementById('origen').value,
                car: document.getElementById('cargo').value,
                tipT: document.getElementById('historico').value,
                modlab: document.getElementById('modulo_lab').value, 
                varieds: document.getElementById('variedad').value,
                fecCosecha: document.getElementById('fechaCosecha').value,
                sup: document.getElementById('supervisor').value,
                herr: document.getElementById('herramientas').value,
                agu: document.getElementById('agua').value,
                fru: document.getElementById('fruta').value,
                falt: document.getElementById('faltas_resp').value,
                regre: document.getElementById('regreso_trab').value,
                sient: document.getElementById('siente_hoy').value, 
                prob: document.getElementById('problemas').value,   
                obs: document.getElementById('observaciones').value, 
                synchronized: 0
            };

            await db.registros.add(registro);
            actualizarVisorPendientes();
            
            alert(navigator.onLine ? "✅ Registro guardado e iniciando envío..." : "⚠️ Guardado localmente sin conexión.");
            
            if (navigator.onLine) {
                await enviarASheets();
            }

            document.getElementById('formEncuesta').reset();
            document.getElementById('fechaCosecha').value = new Date().toISOString().split('T')[0];
        } catch (err) {
            alert("❌ Error al guardar los datos: " + err.message);
            console.error(err);
        }
    };

    async function enviarASheets() {
        if(!navigator.onLine) return;
        const pendientes = await db.registros.where('synchronized').equals(0).toArray();
        for(let r of pendientes) {
            const params = new URLSearchParams();
            params.append("tipoReg", r.tipoReg || "");
            params.append("dni", r.dni || "");
            params.append("nombres", r.nom || "");
            params.append("sexo", r.sex || "");
            params.append("modalidad", r.eda || "");
            params.append("celular", r.cel || "");
            params.append("placa", r.fun || "");
            params.append("origen", r.are || "");
            params.append("cargo", r.car || "");
            params.append("historico", r.tipT || "");
            params.append("supervisor", r.sup || "");
            params.append("modulo_labo", r.modlab || "");     
            params.append("variedad_fruta", r.varieds || ""); 
            params.append("fecha_cosecha", r.fecCosecha || "");
            params.append("herramientas", r.herr || "");      
            params.append("agua", r.agu || "");               
            params.append("fruta", r.fru || "");              
            params.append("faltas_respe", r.falt || "");      
            params.append("regreso_traba", r.regre || "");    
            params.append("sientehoy", r.sient || "");        
            params.append("problemas", r.prob || "");         
            params.append("observaciones", r.obs || "");      

            try {
                await fetch(API_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: params.toString() 
                });
                await db.registros.update(r.id, { synchronized: 1 });
            } catch(e) { 
                console.error("Error en envío:", e); 
            }
        }
        actualizarVisorPendientes();
    }

    // Inicialización al cargar la página
    actualizarPadron();
    actualizarIndicadorConexion();
    setInterval(enviarASheets, 15000);
</script>
</body>
</html>
